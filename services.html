<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=1440"><title>診療内容 | 佐藤医院</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/style.css"></head><body><main class="detail detail-services"><a class="back-link" href="./index.html#services">診療内容に戻る</a><h1>診療内容</h1><div class="detail-service-items"><article><img src="./assets/medical_9_1.jpg" alt="健康診断の診察"><div><h2>健康診断・各種検査</h2><p>定期健康診断をはじめ、血液検査、尿検査、心電図、超音波検査、レントゲン検査などを行い、病気の早期発見と予防に努めます。異常が見つかった場合は、経過観察や専門治療へとつなげてまいります。</p></div></article><article><img src="./assets/patient_1_1.jpg" alt="予防接種の診察"><div><h2>予防接種</h2><p>インフルエンザや肺炎球菌などの各種予防接種を行っています。定期的な接種で感染予防と体調管理を支援いたします。予防接種は予約制となりますので、事前にお問い合わせください。</p></div></article><article><img src="./assets/medical_11_1.jpg" alt="禁煙外来の診察"><div><h2>禁煙外来</h2><p>禁煙をご希望の方に、禁煙治療とサポートを行っています。必要に応じて、ニコチン依存症の治療薬を使用し、無理なく禁煙が継続できるようお手伝いいたします。</p></div></article></div></main></body></html>
